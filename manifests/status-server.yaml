apiVersion: v1
kind: Namespace
metadata:
  name: kube-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-server
  namespace: kube-sandbox
  labels:
    app: status-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-server
  template:
    metadata:
      labels:
        app: status-server
    spec:
      containers:
        - name: api
          image: 513129860998.dkr.ecr.ap-east-2.amazonaws.com/kube-sandbox-api:0.9.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: "server"
            - name: PORT
              value: "8080"
            - name: IDLE_THRESHOLD_MINUTES
              value: "30"
            - name: CHECK_INTERVAL_MINUTES
              value: "5"
            - name: GRACE_PERIOD_MINUTES
              value: "10"
            - name: AWS_REGION
              value: "ap-east-2"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: status-server
  namespace: kube-sandbox
  labels:
    app: status-server
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: status-server
---
apiVersion: v1
kind: Service
metadata:
  name: status-server-nodeport
  namespace: kube-sandbox
  labels:
    app: status-server
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: status-server
